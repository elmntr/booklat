[project]
name = "booklat"
version = "0.1.0"
description = "Offline teacher-assisted oral reading assessment"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]

[project.optional-dependencies]
speech = [
    "faster-whisper>=1.2,<2",
]
model-setup = ["transformers>=4.45,<5", "torch>=2.6,<3", "accelerate>=1,<2"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
